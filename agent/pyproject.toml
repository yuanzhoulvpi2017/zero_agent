[project]
name = "zero-agent-business"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["agentscope>=1.0.18,<2.0.0", "httpx>=0.28,<1", "mcp>=1.26,<2", "python-dotenv>=1,<2", "tqdm>=4.66,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_trail"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
