[model]
path = "model/Qwen/Qwen3.5-4B"

[data]
train_jsonl = "data/paper_trail/datasets/sft/train.jsonl"

[train]
output_dir = "data/paper_trail/models/qwen35-4b-sft-4k"
num_train_epochs = 1.0
# 0 = full epoch(s)
max_steps = 0
per_device_train_batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 2.0e-4
logging_steps = 5
save_steps = 50
save_total_limit = 3
bf16 = true
# RTX 3090 LoRA+ckpt practical limit with current kernels (~22GiB at 4k full CE).
# Longer context OOMs; 64k needs QLoRA / multi-GPU sharding / more VRAM.
max_length = 4096
gradient_checkpointing = true
warmup_steps = 50
lr_scheduler_type = "cosine"
seed = 7
device_map = "none"
report_to = []

[lora]
enabled = true
r = 16
alpha = 32
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]
