[project]
name = "paper-trail-training"
version = "0.1.0"
description = "PaperTrail SFT training with TRL on Qwen3.5-4B"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4.0",
  "transformers>=4.55.0",
  "trl>=0.21.0",
  "peft>=0.15.0",
  "datasets>=3.0.0",
  "accelerate>=1.0.0",
  "sentencepiece>=0.2.0",
  "protobuf>=5.0.0",
  "causal-conv1d>=1.5.0",
  "flash-linear-attention>=0.5.0",
  "einops>=0.8.0",
  "bitsandbytes>=0.45.0",
]

[tool.uv]
package = false
